[project]
name = "ITBench"
version = "0.1.0"
description = "ITBench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk>=0.3.0",
    "asteval>=1.0.0",
    "click>=8.1.8",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "json-repair>=0.30.0",
    "langchain-google-genai>=2.1.4",
    "langgraph>=0.4.1",
    "litellm>=1.0.0",
    "numpy>=2.2.6",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
    "scipy>=1.15.3",
    "sse-starlette>=2.3.5",
    "starlette>=0.46.2",
    "typer>=0.21.1",
    "uvicorn>=0.34.2",
]

[project.scripts]
agentbeats-run = "agentbeats.run_scenario:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
dev-dependencies = [
    "mypy>=1.18.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentbeats"]
