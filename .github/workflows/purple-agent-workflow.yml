name: Run Assessment

on:
  push:
    paths:
      - 'scenario.toml'
  workflow_dispatch:

jobs:
  evaluate:
    uses: itbench-hub/ITBench-Agentbeats-Leaderboard-v2/.github/workflows/run-scenario.yml
    with:
      leaderboard_repo: 'itbench-hub/ITBench-Agentbeats-Leaderboard-v2'
      scenario_file: 'scenario.toml'
    secrets:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
